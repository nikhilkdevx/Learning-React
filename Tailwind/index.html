<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailWind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="border-2 border-slate-200 w-1/2 h-68 m-4 rounded-md">
        <div class="bg-linear-65 from-purple-500 to-pink-500 h-16 text-white font-bold flex justify-center items-center">
            <p>News you can Trust</p>
        </div>
        <div class="h-44 text-center">
            <p class=" font-bold mt-4">Stay up to date with Latest!</p>
            <p class="">Subscribe to our newsletter for the latest news staright into your inbox</p>
            <form class="flex flex-wrap">
                <input placeholder="you@example.com" class="bg-slate-200 w-full mx-32 text-center placeholder:text-sm mt-2 mb-2 py-1">
                <button class="bg-blue-500 rounded-full w-full text-white mx-32 py-1 ">Subcribe Now</button>
            </form>
            <p class="mx-4 mt-4 font-semibold">We value your privacy</p>
        </div>
    </div>
</body>
</html>
